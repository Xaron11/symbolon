name: Bug
description: Something does not work as specified.
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed behavior, with exact error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, location types (local, pendrive, Android model). Use made-up paths, not personal ones.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `symbolon --version` or the commit.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Linux, Windows, Android, NixOS, Other]
