name: Set up Rust
description: Install the toolchain from rust-toolchain.toml, just, and on Linux the Tauri system libraries.

inputs:
  components:
    description: Extra rustup components, space-separated.
    required: false
    default: ""
  tauri-libs:
    description: Install the Tauri system libraries on Linux ("true" or "false").
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Tauri system libraries
      if: runner.os == 'Linux' && inputs.tauri-libs == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
    - name: Toolchain
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
      run: |
        rustup toolchain install
        if [[ -n "$COMPONENTS" ]]; then
          read -ra components <<< "$COMPONENTS"
          rustup component add "${components[@]}"
        fi
    # Every job runs its work through just recipes; the version matches the dev shell's.
    - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
      with:
        tool: just@1.59.0
