name: Set up Rust
description: Install the toolchain from rust-toolchain.toml and, on Linux, the Tauri system libraries.

inputs:
  components:
    description: Extra rustup components, space-separated.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Tauri system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libssl-dev
    - name: Toolchain
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
      run: |
        rustup toolchain install
        if [[ -n "$COMPONENTS" ]]; then
          read -ra components <<< "$COMPONENTS"
          rustup component add "${components[@]}"
        fi
