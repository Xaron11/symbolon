name: App bundles

# Builds the desktop app's packages: the AppImage and .deb on Linux, the installer on Windows.
# The release calls it with the Android agent inside (ADR-0026); pull requests that change the
# packaging run it without, so a broken bundle shows up before a release does.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build.
        required: true
        type: string
      name:
        description: Version in the file names, e.g. v0.8.0.
        required: true
        type: string
      agent:
        description: Bundle the Android agent from this run's agent-binary artifact.
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/app-bundles.yml
      - crates/symbolon-app/Cargo.toml
      - crates/symbolon-app/tauri*.json
      - crates/symbolon-app/icons/**

permissions: {}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # One platform's failure should not hide whether the other's package builds.
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the AppImage and .deb also run on older systems.
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    env:
      NAME: ${{ inputs.name || 'pr' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: AppImage tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq --no-install-recommends patchelf file libfuse2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: crates/symbolon-app/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        working-directory: crates/symbolon-app/ui
      # The version the dev shell uses; release builds avoid caches.
      - run: cargo install tauri-cli --version 2.12.6 --locked
      - if: inputs.agent
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-binary
          path: agent
      - name: Build
        working-directory: crates/symbolon-app
        env:
          BUNDLES: ${{ matrix.bundles }}
          AGENT: ${{ inputs.agent }}
        run: |
          config=()
          if [[ "$AGENT" == true ]]; then
            chmod 755 ../../agent/symbolon-agent
            config=(--config tauri.release.conf.json)
          fi
          cargo tauri build --ci --bundles "$BUNDLES" "${config[@]}"
      - name: Package
        run: |
          mkdir dist
          bundle=target/release/bundle
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "$bundle"/nsis/*-setup.exe "dist/symbolon-app-${NAME}-x86_64-setup.exe"
          else
            cp "$bundle"/appimage/*.AppImage "dist/symbolon-app-${NAME}-x86_64.AppImage"
            cp "$bundle"/deb/*.deb "dist/symbolon-app-${NAME}-amd64.deb"
            # The .deb must carry the agent in a release, where the app looks for it.
            if [[ "$NAME" != pr ]]; then
              dpkg-deb --contents dist/*.deb | grep -q 'usr/lib/Symbolon/symbolon-agent-aarch64-linux-musl'
            fi
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.os }}
          path: dist/*
