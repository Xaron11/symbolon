name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runs on main are never cancelled, so their caches always get saved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  # No debug info in CI builds: faster compiles and smaller caches. Backtraces keep function names.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Caches are written only from main; PRs restore them but never evict them.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  # Decides which slow jobs a pull request needs. Pushes to main always run everything, which
  # keeps the caches warm and catches anything a filter missed before a release.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      nix: ${{ steps.diff.outputs.nix }}
      agent: ${{ steps.diff.outputs.agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            { echo nix=true; echo agent=true; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE"...HEAD)"
          # File names are the PR author's; never let them act as workflow commands.
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          echo "$changed"
          echo "::$stop::"
          # Inputs every Nix build depends on.
          shared='^(flake\.(nix|lock)|Cargo\.(toml|lock)|rust-toolchain\.toml|justfile|\.github/workflows/ci\.yml)$'
          nix=false
          agent=false
          if grep -qE "$shared" <<< "$changed"; then nix=true; agent=true; fi
          # crane keeps only Rust sources and Cargo files; plain .rs changes are already built by
          # clippy and test, so the package can only break through other files of its crates.
          if grep -E '^crates/symbolon-(core|cli)/' <<< "$changed" | grep -vE '\.rs$|/(tests|benches)/' | grep -q .; then
            nix=true
          fi
          # The app package also pins the frontend's dependencies by hash and runs Tauri's build.
          if grep -qE '^crates/symbolon-app/(ui/(package\.json|pnpm-lock\.yaml)|tauri\.conf\.json|Cargo\.toml)$' <<< "$changed"; then
            nix=true
          fi
          if grep -qE '^crates/symbolon-agent/' <<< "$changed"; then agent=true; fi
          { echo "nix=$nix"; echo "agent=$agent"; } | tee -a "$GITHUB_OUTPUT"

  hooks:
    name: hooks (format, typos, nix, workflows)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-ci-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-ci-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          save: ${{ env.SAVE_CACHE }}
      - run: nix develop .#ci -c just ui-install
      - name: pre-commit hooks on all files
        # zizmor uses the token for online audits (impostor commits, known-vulnerable actions).
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#ci -c pre-commit run --all-files --show-diff-on-failure

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: --workspace
          # Windows covers core and cli until the Windows milestone (M8).
          - os: windows-latest
            packages: -p symbolon-core -p symbolon-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
          save-if: ${{ env.SAVE_CACHE }}
      - run: cargo clippy ${{ matrix.packages }} --all-targets --locked
      # symbolon-core must also build with its optional features off (ADR-0006).
      - name: clippy (core, no default features)
        if: runner.os == 'Linux'
        run: cargo clippy -p symbolon-core --no-default-features --all-targets --locked
      - name: rustdoc
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: rustdoc
          path: target/doc
          retention-days: 7
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: runner.os == 'Linux'
        with:
          tool: cargo-shear
      - name: unused dependencies
        if: runner.os == 'Linux'
        run: cargo shear

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Windows covers core and cli until the Windows milestone (M8), as in clippy.
        include:
          - os: ubuntu-latest
            packages: --workspace
          - os: windows-latest
            packages: -p symbolon-core -p symbolon-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ env.SAVE_CACHE }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest,cargo-llvm-cov
      # Linux runs the suite once, instrumented, and reports coverage from that run.
      - name: tests with coverage
        if: runner.os == 'Linux'
        run: |
          # Ignored tests run here too (the 100k-file acceptance test), except the two that rewrite
          # committed files: the schema fixture writer, and the bindings writer, which would race
          # `bindings_are_current` reading the same file.
          cargo llvm-cov nextest ${{ matrix.packages }} --locked --profile ci --no-tests=warn \
            --run-ignored all -E 'not (test(=write_fixture) | test(=bindings::tests::write))'
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Each property-test case creates a catalog, and file creation is slow on Windows runners
      # (~0.5 s per case). The model tests check SQL, not the platform; Linux runs all 200 cases.
      - name: tests
        if: runner.os != 'Linux'
        env:
          PROPTEST_CASES: "32"
        run: cargo nextest run ${{ matrix.packages }} --locked --profile ci --no-tests=warn
      # Only library crates have doctests.
      - name: doctests
        run: cargo test -p symbolon-core --locked --doc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates/symbolon-app/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: crates/symbolon-app/ui/package.json
      # The pnpm store is cached by hand rather than with setup-node's `cache: pnpm`, which also
      # saves from PRs; like every other cache here, it is written from main only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('crates/symbolon-app/ui/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm license-check
      - name: Save pnpm store
        if: env.SAVE_CACHE == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('crates/symbolon-app/ui/pnpm-lock.yaml') }}

  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - run: cargo deny check

  nix:
    name: nix (flake check, CLI and app packages)
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-build-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-build-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          save: ${{ env.SAVE_CACHE }}
      - run: nix flake check

  android-agent:
    name: android agent (cross-build, static check)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-android-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-android-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          save: ${{ env.SAVE_CACHE }}
      - name: Restore build cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: agent-target-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
          restore-keys: agent-target-
      - run: nix develop .#android -c just android-scanner check-agent
      - name: Save build cache
        if: env.SAVE_CACHE == 'true' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: agent-target-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}

  docs:
    name: docs (book, API, links)
    needs: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-ci-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-ci-${{ runner.os }}-
          save: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustdoc
          path: docs/api
      - name: Build the book and check links
        run: nix develop .#ci -c just docs-book docs-links
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: target/book
          retention-days: 14
      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, hooks, clippy, test, frontend, deny, nix, android-agent, docs]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # `skipped` only happens for jobs `changes` ruled out; a failed `changes` fails this job.
      - name: All jobs succeeded or were not needed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [[ "$r" == success || "$r" == skipped ]] || exit 1; done

  # Publishes the book and API reference from main once every other job passed (ADR-0008).
  pages:
    name: pages (publish docs)
    needs: ci-ok
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # An older deployment never overwrites a newer one mid-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
