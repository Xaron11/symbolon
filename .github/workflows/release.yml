name: Release

on:
  push:
    tags: ["v*"]
  # Re-run a release for an existing tag with the workflow from main (for example after fixing
  # this file). The tag is verified exactly as on push.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify tag
    # A re-run uses the workflow from main, never one from another branch.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      # Full history with all branches and tags, fetched by checkout itself: no credentials are
      # kept for later git commands.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Tag is signed by an allowed key
        # The allowed signers are read from main, not from the tagged commit, so a tag
        # cannot vouch for itself.
        run: |
          [[ "$(git cat-file -t "$TAG")" == tag ]] || { echo "::error::$TAG is not an annotated tag"; exit 1; }
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" tag -v "$TAG"
          git merge-base --is-ancestor "$TAG" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - name: Tag matches the workspace version
        id: version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)"
          [[ "v$version" == "$TAG" ]] || { echo "::error::tag $TAG does not match Cargo.toml version $version"; exit 1; }
          # Later jobs build this commit, not whatever the tag name points to by then.
          { echo "version=$version"; echo "sha=$(git rev-parse "$TAG^{commit}")"; } >> "$GITHUB_OUTPUT"

  cli:
    name: cli (${{ matrix.target }})
    # The archives carry the Android agent next to the CLI (ADR-0017).
    needs: [verify, android-agent]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: symbolon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: symbolon.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Tag still points at the verified commit
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: '[[ "$(git rev-parse HEAD)" == "$SHA" ]] || { echo "::error::$TAG moved after it was verified"; exit 1; }'
      - env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install && rustup target add "$TARGET"
      - env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p symbolon-cli --target "$TARGET"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-binary
          path: agent
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          name="symbolon-${TAG}-${TARGET}"
          mkdir "$name"
          cp "target/${TARGET}/release/${EXE}" LICENSE-MIT LICENSE-APACHE README.md "$name/"
          # Artifacts lose the executable bit; it matters only on the phone, where it is set.
          cp agent/symbolon-agent "$name/symbolon-agent-aarch64-linux-musl"
          chmod 755 "$name/symbolon-agent-aarch64-linux-musl"
          "target/${TARGET}/release/${EXE}" man --out "$name/man"
          mkdir "$name/completions"
          for shell in bash zsh fish elvish powershell; do
            "target/${TARGET}/release/${EXE}" completions "$shell" > "$name/completions/symbolon.$shell"
          done
          echo "Corresponding source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${TAG}" > "$name/SOURCE.txt"
          if [[ "$RUNNER_OS" == "Windows" ]]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: symbolon-*.*z*

  android-agent:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Tag still points at the verified commit
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: '[[ "$(git rev-parse HEAD)" == "$SHA" ]] || { echo "::error::$TAG moved after it was verified"; exit 1; }'
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - run: nix develop .#android -c just android-scanner check-agent
      - name: Package
        run: |
          name="symbolon-agent-${TAG}-aarch64-linux-musl"
          mkdir "$name"
          cp target/aarch64-unknown-linux-musl/release-agent/symbolon-agent LICENSE-MIT LICENSE-APACHE "$name/"
          echo "Corresponding source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${TAG}" > "$name/SOURCE.txt"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-agent
          path: symbolon-agent-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-binary
          path: target/aarch64-unknown-linux-musl/release-agent/symbolon-agent

  app:
    # The desktop packages carry the Android agent, like the CLI archives (ADR-0026).
    needs: [verify, android-agent]
    permissions:
      contents: read
    uses: ./.github/workflows/app-bundles.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}
      name: ${{ inputs.tag || github.ref_name }}
      agent: true

  publish:
    needs: [verify, cli, android-agent, app]
    runs-on: ubuntu-latest
    permissions:
      # Create the release; sign build provenance with the workflow's OIDC identity.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # The release archives only; the bare agent binary is already inside the CLI archives.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-agent
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-*
          path: dist
          merge-multiple: true
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: git-cliff@2.14.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Checksums and notes
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          {
            git cliff --current --strip all
            echo
            echo "Built from source tag [${TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${TAG}) under MIT OR Apache-2.0. Verify downloads with \`sha256sum -c SHA256SUMS\`."
          } > "$RUNNER_TEMP/notes.md"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ startsWith(needs.verify.outputs.version, '0.') }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$SHA" ]] || { echo "::error::$TAG moved after it was verified"; exit 1; }
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Symbolon $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
