name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is signed by an allowed key
        # The allowed signers are read from main, not from the tagged commit, so a tag
        # cannot vouch for itself.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" main
          [[ "$(git cat-file -t "$TAG")" == tag ]] || { echo "::error::$TAG is not an annotated tag"; exit 1; }
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" tag -v "$TAG"
          git merge-base --is-ancestor "$TAG" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - name: Tag matches the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)"
          [[ "v$version" == "$TAG" ]] || { echo "::error::tag $TAG does not match Cargo.toml version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  cli:
    name: cli (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: symbolon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: symbolon.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install && rustup target add "$TARGET"
      - env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p symbolon-cli --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
          TAG: ${{ github.ref_name }}
        run: |
          name="symbolon-${TAG}-${TARGET}"
          mkdir "$name"
          cp "target/${TARGET}/release/${EXE}" LICENSE README.md "$name/"
          echo "Corresponding source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${TAG}" > "$name/SOURCE.txt"
          if [[ "$RUNNER_OS" == "Windows" ]]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: symbolon-*.*z*

  android-agent:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - run: nix develop .#android -c just android-scanner check-agent
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="symbolon-agent-${TAG}-aarch64-linux-musl"
          mkdir "$name"
          cp target/aarch64-unknown-linux-musl/release-agent/symbolon-agent LICENSE "$name/"
          echo "Corresponding source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${TAG}" > "$name/SOURCE.txt"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-agent
          path: symbolon-agent-*.tar.gz

  publish:
    needs: [verify, cli, android-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: git-cliff
      - name: Checksums and notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          {
            git cliff --latest --strip all
            echo
            echo "Built from source tag [${TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${TAG}) under GPL-3.0-or-later. Verify downloads with \`sha256sum -c SHA256SUMS\`."
          } > "$RUNNER_TEMP/notes.md"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ startsWith(needs.verify.outputs.version, '0.') }}
        run: |
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Symbolon $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
