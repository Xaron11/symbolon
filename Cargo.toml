[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/symbolon-core", "crates/symbolon-cli", "crates/symbolon-agent"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Xaron11/symbolon"
publish = false

[workspace.dependencies]
symbolon-core = { path = "crates/symbolon-core" }
anyhow = "1.0.105"
blake3 = "1.8.7"
clap = { version = "4.6.9", features = ["derive", "env", "string"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
criterion = "0.8.2"
crossbeam-channel = "0.5.17"
ctrlc = "3.5.3"
csv = "1.4.0"
dirs = "7.0.0"
ignore = "0.4.35"
insta = { version = "1.49.0", features = ["filters"] }
mimalloc = "0.1.52"
proptest = "1.12.0"
rayon = "1.12.0"
rusqlite = { version = "0.43.0", features = ["bundled", "fallible_uint", "functions"] }
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# tauri-specta 2 is a release candidate: exact pins, upgraded deliberately (ADR-0024).
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri = "2.12.7"
tauri-build = "2.7.6"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-mcp-bridge = "=0.13.2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
let_underscore_drop = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
missing_crate_level_docs = "warn"
bare_urls = "warn"
unescaped_backticks = "warn"
redundant_explicit_links = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
doc_markdown = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_link_with_quotes = "warn"
# Restriction lints: no panicking shortcuts, no silent lint suppression.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes = "warn"
allow_attributes_without_reason = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.release-agent]
inherits = "release"
lto = "fat"
panic = "abort"
strip = "symbols"
