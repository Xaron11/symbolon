# git-cliff configuration: Conventional Commits rendered as Keep a Changelog. Breaking changes
# (`feat!:` or a `BREAKING CHANGE:` footer) are marked, with the footer's description.
# Regenerate with `just changelog`.

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        {% set summary = commit.message | split(pat="\n") | first | trim -%}
        - {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ summary | upper_first }}\
          {% if commit.breaking and commit.breaking_description and commit.breaking_description != summary %}. {{ commit.breaking_description | trim | upper_first }}{% endif %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Only the commit type decides the group: every squashed PR body has a "Security impact"
# heading, so matching the body would file unrelated commits under Security.
commit_parsers = [
  # A license change matters to every user, whatever its commit type.
  { message = "^[a-z]+(\\(.*\\))?!?: relicense", group = "<!-- 1 -->Changed" },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^refactor", group = "<!-- 1 -->Changed" },
  { message = "^(build|chore|ci|docs|style|test)", skip = true },
]
protect_breaking_commits = true
filter_commits = false
sort_commits = "oldest"

[bump]
# Stay on 0.x until the first stable release: breaking changes bump the minor version.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
