# cargo-deny policy. Every allowed license must let the binaries be distributed under MIT OR
# Apache-2.0: permissive licenses, or MPL-2.0, whose copyleft stays within its own files.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Also report unsound/unmaintained advisories for transitive dependencies (default: direct only).
unsound = "all"
unmaintained = "all"
ignore = [
  # Pulled in only by gtk-rs 0.18 (Tauri's Linux runtime), which is frozen upstream.
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk 0.18, no upgrade available" },
  # Unsound glib::VariantStrIter (fixed in glib 0.20). Tauri pins gtk-rs 0.18, and no crate in
  # our graph calls VariantStrIter or Variant::array_iter_str (checked 2026-11-24).
  { id = "RUSTSEC-2024-0429", reason = "affected API unused in our dependency graph; blocked on tauri moving off gtk 0.18" },
]

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
