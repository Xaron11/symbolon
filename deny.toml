# cargo-deny policy. Every allowed license must be compatible with GPL-3.0-or-later.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Pulled in only by gtk-rs 0.18 (Tauri's Linux runtime), which is frozen upstream.
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk 0.18, no upgrade available" },
]

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
