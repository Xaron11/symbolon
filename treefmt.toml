# Formats the whole repository: `just fmt` (write) or `treefmt --ci` (check).
# Prettier comes from the frontend's lockfile so editors, hooks and CI agree on one version.

excludes = [
  "LICENSE-*",
  "*.lock",
  "**/pnpm-lock.yaml",
  "crates/symbolon-app/icons/**",
  "crates/symbolon-app/gen/**",
  # Generated by symbolon-app (`just bindings`); compared byte for byte by its drift test.
  "crates/symbolon-app/ui/src/lib/api/bindings.ts",
]

[formatter.rustfmt]
command = "rustfmt"
includes = ["*.rs"]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.shfmt]
# Indentation comes from .editorconfig, which bash-language-server's formatting reads too.
command = "shfmt"
options = ["--write"]
includes = ["*.sh"]

[formatter.taplo]
command = "taplo"
options = ["format"]
includes = ["*.toml"]

[formatter.prettier]
command = "crates/symbolon-app/ui/node_modules/.bin/prettier"
options = ["--write"]
includes = ["*.md", "*.yml", "*.yaml", "*.json", "*.js", "*.ts", "*.svelte", "*.css", "*.html"]
